# ============================================================================
# G1 TWIN CONTRACT — what the sim must publish for the sim to BE the robot.
#
# This file is the single source of truth for the G1 digital twin:
#   * the sim reads it to place sensor prims, configure publishers, emit /tf_static
#   * tools/twin_audit.py reads it to decide whether the sim is telling the truth
#   * tools/tests/test_twin_contract.py asserts these numbers still equal the driver's
#
# EVERY geometric value carries `provenance` and `source`.
#   calibrated   solved against measured data on the real robot
#   urdf_nominal from the Unitree URDF (may be superseded by calibration)
#   datasheet    vendor specification
#   measured     read off a live/recorded capture
#   configured   a value we chose and encoded in a driver launch/config
#   assumed      NOT established -- a promise to come back. twin_audit prints these
#                separately so an assumption cannot quietly become a fact.
#
# Sources are cited as <repo>/<path>:<line> against ~/panthera/ref/.
# Nothing here may be edited to make the sim pass. If the sim disagrees with this
# file, the SIM is wrong. If this file disagrees with the driver repo, the DRIVER
# repo wins and this file is the bug.
# ============================================================================

schema_version: 1

robot:
  type: g1
  id: g1_01
  namespace: /ferox/g1_01
  # HARDWARE FACT: base_link IS the pelvis. The 29-DoF URDF roots at `pelvis`, but no
  # `pelvis` frame exists anywhere in the robot's ROS TF tree -- odom_tf_bridge relabels
  # /state_estimator/odom_pelvis's child from `pelvis` to `base_link`. The twin must
  # never publish a `pelvis` frame.
  base_frame: base_link
  odom_frame: odom
  description: >-
    Unitree G1 EDU U4, 29 DoF (g1_29dof_rev_1_0), Mid-360 inverted in the head,
    D435i in the same head, Dex5-1P hands (DT3).
  standing_pelvis_height_m: 0.731   # see docs/twin/TWIN_DEVIATIONS.md C-1 (provisional)

# ---------------------------------------------------------------------------
# SENSORS — physical placement. Poses are parent_link -> sensor frame.
# ---------------------------------------------------------------------------
sensors:
  - name: livox_mid360
    model: Livox Mid-360
    # Waist-INDEPENDENT mount. The head sensors ride the 3-joint waist chain, so the
    # only pose that is constant is the one measured from torso_link. base_link ->
    # livox_frame is then a COMPOSITION of the waist joints with this mount, which is
    # why the driver runs waist_tf_bridge rather than a static publisher.
    parent_link: torso_link
    pose:
      xyz: [-0.0440849, -0.0185556, 0.4429585]
      rpy: [3.128688, 0.052979, 0.018520]   # +179.2606, +3.0355, +1.0611 deg
      provenance: calibrated
      source: >-
        panthera-g1-driver/src/panthera_g1_driver/config/g1_driver.yaml:137-142
        (waist_tf_bridge; calibrated standing 2026-08-07, floor-plane residual 0.0027 deg).
        INVERTED mount confirmed two ways: the floor plane fits on the +z side of the
        sensor, and the Livox IMU reads az ~ -0.99 g at rest. Hence roll near pi.
        The URDF nominal mid360_joint (xyz 0.0002835 0.00003 0.40618, rpy 0 0.04014 0)
        was REJECTED by this calibration: 60.6 mm and 1.5 deg off.
    model_params:
      # Datasheet figures. The RTX proxy cannot reproduce the non-repetitive rosette
      # scan pattern -- that is a declared Class-C deviation, see TWIN_DEVIATIONS.md.
      azimuth_deg: [-180.0, 180.0]
      elevation_deg: [-7.0, 52.0]
      range_m: [0.1, 40.0]
      scan_rate_hz: 10.0
      points_per_second: 200000
      range_accuracy_m: 0.02
      provenance: datasheet
      source: Livox Mid-360 datasheet; rate corroborated by /livox/lidar at 10.000 Hz
    notes: >-
      The real cloud is RAW: sensor frame, not deskewed, NOT self-filtered. It contains
      the robot's own head shell from ~0.10 m out (r_min 0.0985 m, stable over 897
      clouds), which is exactly why p2l range_min is 0.30.

  - name: d435i
    model: Intel RealSense D435i
    parent_link: torso_link
    pose:
      xyz: [0.0576235, 0.01753, 0.41987]
      rpy: [0.0, 0.8307767239493009, 0.0]   # +47.600 deg pitch DOWN about +y
      provenance: urdf_nominal
      source: >-
        panthera-g1-driver/src/panthera_g1_driver/config/g1_driver.yaml:188-193
        (camera_mount_*), URDF-exact per
        panthera-g1-driver/evidence/fw2026q3/camera_extrinsics_provenance.md:35,41-47
        (joint d435_joint, torso_link -> d435_link, copied verbatim from the URDF).
        UNVERIFIED as a physical measurement: nominal only, +-60 mm / +-1.5 deg. The
        driver keeps camera_tf_enable:false (g1_driver.yaml:186) until a floor-plane
        check confirms it, so base_link -> camera_link is NOT in the robot's live
        /tf_static today and the camera subtree is an orphan root.
        DO NOT "correct" 47.60 deg to the 42.4 deg / 55.2 deg annotations in Unitree's
        diagram: those are FOV geometry, not mount angle
        (camera_extrinsics_provenance.md, section 3). The same document notes the waist
        portion of this chain is bit-identical to what waist_tf_bridge already implements
        for the lidar edge -- an independent confirmation of the lidar path.
    model_params:
      color_resolution: [1280, 720]
      color_rate_hz: 30
      depth_module_resolution: [848, 480]
      depth_rate_hz: 30
      cloud_resolution_after_decimation: [424, 240]
      clip_distance_m: 4.0        # clips on Z (depth), not euclidean range
      min_z_m: 0.28               # ~MinZ at 848x480; no near-bound parameter is set
      visual_preset: 3            # High Accuracy (INTEGER on realsense2-camera 4.58.2)
      decimation_magnitude: 2
      filter_order: decimation -> depth_to_disparity -> spatial -> temporal -> disparity_to_depth
      hole_filling: false
      provenance: configured
      source: >-
        realsense_driver/params.yaml:32-65 (preset, clip_distance, decimation, spatial,
        temporal, disparity domain), realsense_driver/compose.yaml:27-28 (profiles),
        realsense_driver/params.yaml:43 (MinZ ~0.28 m at 848x480).
        Smoothers run in the DISPARITY domain because the wrapper's filter order is fixed.
    notes: >-
      DEPTH UNITS ARE NOT WRITTEN DOWN ANYWHERE. realsense_driver states encoding 16UC1
      (README.md:24) but never sets depth_module.depth_units and never states mm vs m.
      The twin publishes millimetres by librealsense convention; this is `assumed` and
      needs one hardware confirmation. See open question OQ-1.

  - name: dog_imu
    model: G1 body IMU (from /lowstate.imu_state)
    parent_link: base_link
    pose:
      xyz: [0.0, 0.0, 0.0]
      rpy: [-0.000966, -0.010877, 0.0]   # -0.0553, -0.6232 deg -- standing residual
      provenance: calibrated
      source: >-
        panthera-g1-driver/src/panthera_g1_driver/launch/g1_driver_hw.launch.py:501,508
        (imu_mount_roll_rad / imu_mount_pitch_rad defaults), published at :363-368.
        Near-identity: the residual tilt of the body IMU while standing.

  - name: livox_imu
    model: Mid-360 internal IMU
    parent_link: livox_frame
    pose:
      xyz: [0.011, 0.02329, -0.04412]
      rpy: [0.0, 0.0, 0.0]
      provenance: datasheet
      source: >-
        panthera-g1-driver/src/panthera_g1_driver/launch/g1_driver_hw.launch.py:495-497
        (livox_imu_x/y/z defaults; Livox datasheet offset), published at :349-354.

# ---------------------------------------------------------------------------
# TF STATIC — EXACTLY the edge set the robot publishes, and nothing else.
# Session A recorded 7 edges. An extra edge is a Class-A failure: the twin must not
# invent frames (baseline defect B-1/B-3 was exactly that).
# ---------------------------------------------------------------------------
tf_static:
  - parent: base_link
    child: dog_imu_link
    xyz: [0.0, 0.0, 0.0]
    rpy: [-0.000966, -0.010877, 0.0]
    provenance: calibrated
    source: panthera-g1-driver/.../g1_driver_hw.launch.py:363-368, defaults :501,:508

  # STATIC-MODE composite. In the driver's default waist-bridge mode this edge is
  # published DYNAMICALLY by waist_tf_bridge as waist(q) x torso->livox. These numbers
  # are that composition evaluated at the standing pose, and DT2 must reproduce them to
  # <=1e-3 rad / <=2 mm as the waist round-trip check (doc/05-validation.md 11.2).
  - parent: base_link
    child: livox_frame
    xyz: [0.0, 0.0, 0.4995]
    rpy: [3.090233, 0.161680, 0.0]   # +177.0573, +9.2636, 0 deg
    provenance: calibrated
    source: >-
      panthera-g1-driver/.../g1_driver_hw.launch.py:459-478 (lidar_x/y/z,
      lidar_roll_rad/lidar_pitch_rad/lidar_yaw_rad defaults), published at :321-326.
      z = 0.4995 EMPIRICAL (1.2304 m lidar-to-floor minus 0.7310 m standing pelvis).
      The Unitree doc's 0.47618 m carries a NEGATIVE sign, which is wrong for a
      base_link->lidar edge; empirical wins.

  - parent: livox_frame
    child: livox_imu
    xyz: [0.011, 0.02329, -0.04412]
    rpy: [0.0, 0.0, 0.0]
    provenance: datasheet
    source: panthera-g1-driver/.../g1_driver_hw.launch.py:495-497, published at :349-354

  # ---- RealSense intra-camera subtree ----
  # THESE FOUR EDGES EXIST ON THE ROBOT (session_a/31_tf_static.txt) BUT THEIR VALUES
  # ARE NOT RECORDED ANYWHERE WE HAVE. realsense_driver contains zero numeric transforms
  # (README.md:9: "publishes no TF into the robot's chain"); librealsense emits them from
  # the device at runtime. Session A captured edge NAMES only, no values.
  # The optical-frame rotations below are the fixed REP-103 body->optical convention and
  # are safe; the camera_link->*_frame translations are NOT known. See OQ-1.
  - parent: camera_link
    child: camera_color_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    provenance: assumed
    source: >-
      EDGE confirmed at panthera-g1-driver/evidence/fw2026q3/session_a/31_tf_static.txt.
      VALUES unknown: absent from realsense_driver (zero grep hits for camera_link).
      Placeholder identity -- MUST be replaced from a real /tf_static capture (OQ-1).
  - parent: camera_color_frame
    child: camera_color_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]
    provenance: assumed
    source: >-
      EDGE confirmed at session_a/31_tf_static.txt. Rotation is the fixed REP-103
      body-style -> optical-style convention (-pi/2, 0, -pi/2), not a measurement.
  - parent: camera_link
    child: camera_depth_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    provenance: assumed
    source: >-
      EDGE confirmed at session_a/31_tf_static.txt. VALUES unknown, see OQ-1.
  - parent: camera_depth_frame
    child: camera_depth_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]
    provenance: assumed
    source: EDGE confirmed at session_a/31_tf_static.txt. REP-103 optical convention.

# NOTE ON base_link -> camera_link: the driver CAN publish it (camera_child_frame:
# camera_link, camera_mount_* in g1_driver.yaml:186-193) but ships it DISABLED
# (camera_tf_enable: false) pending a floor-plane check. It is therefore absent from
# session_a/31_tf_static.txt, and the camera subtree is an orphan root on the real robot
# today. The twin reproduces that: it does NOT publish base_link -> camera_link until the
# driver enables it. Campaign DT2 step 2 assumed this edge is published -- it is not.

# ---------------------------------------------------------------------------
# pointcloud_to_laserscan — the driver's exact parameters. Class A, reproduced
# to the digit. Do NOT re-derive these to suit the sim body: see TWIN_DEVIATIONS C-1.
# ---------------------------------------------------------------------------
pointcloud_to_laserscan:
  target_frame: base_link
  transform_tolerance: 0.1
  min_height: -0.556      # clears the floor by 0.175 m at the standing pelvis height
  max_height: 0.50        # 1.231 m above the floor
  angle_min: -3.141592653589793     # -math.pi EXACTLY (Go2 uses -3.14159; not the same)
  angle_max: 3.141592653589793
  angle_increment: 0.0087           # ~0.5 deg
  scan_time: 0.1                    # cloud measured at 9.95 Hz
  range_min: 0.30                   # rejects the head-shell self-hit cluster (0.10-0.20 m)
  range_max: 6.0                    # MATCHED PAIR with AMCL laser_max_range in Ferox
  use_inf: true
  inf_epsilon: 1.0
  queue_size: 5
  provenance: configured
  source: >-
    panthera-g1-driver/.../g1_driver_hw.launch.py:230-266 (node params) with defaults at
    :424-434 (scan_min_height -0.556, scan_max_height 0.50, scan_range_min 0.30,
    scan_range_max 6.0). STANDING-POSTURE ASSUMPTION: base_link is the pelvis, so the
    floor's height in base_link IS the pelvis height. Crouched, the same robot put the
    floor at -0.588 m. Any stand-height FSM invalidates this slice.

# ---------------------------------------------------------------------------
# TOPICS — the wire. Names, types, frames and encodings are Class A (exact).
# Rates are Class B (+-10%, camera >=20 Hz).
# ---------------------------------------------------------------------------
topics:
  - name: /ferox/g1_01/scan
    type: sensor_msgs/msg/LaserScan
    direction: publish
    frame_id: base_link
    rate_hz: 10.0
    qos: {reliability: reliable, durability: volatile}
    parity_class: A
    provenance: configured
    source: panthera-g1-driver/.../g1_driver_hw.launch.py:138 (scan_topic), :230 (remap)
    expect:
      laserscan:
        ray_count: 723
        angle_min: -3.141592653589793
        angle_max: 3.141592653589793
        angle_increment: 0.0087
        scan_time: 0.1
        range_min: 0.30
        range_max: 6.0

  - name: /ferox/g1_01/odom
    type: nav_msgs/msg/Odometry
    direction: publish
    frame_id: odom
    # 26.2 Hz, NOT the 51.4 Hz the campaign brief lists. See the note below -- this is
    # the one number in this contract that contradicts the brief on measurement method
    # rather than on transcription, and it is flagged as OQ-3.
    rate_hz: 26.2
    qos: {reliability: reliable, durability: volatile}
    parity_class: A
    provenance: measured
    source: >-
      panthera-g1-driver/.../g1_driver_hw.launch.py:275 (out_topic), republished from
      /state_estimator/odom_pelvis with child_frame relabelled pelvis -> base_link.
      Covariance is all-zero on hardware and inject_static_covariance is false
      (g1_driver.yaml:85) -- the twin matches that.
      RATE: 26.20 Hz measured on THIS topic by a QoS-matched rclpy subscriber over a
      20 s window (evidence/fw2026q3/session_a/30_evidence.txt: 524 msgs, gap median
      38.54 ms, gap max 55.69 ms). The 51.4 Hz figure in the campaign brief is the
      SOURCE topic /state_estimator/odom_pelvis measured with `ros2 topic hz`
      (evidence/fw2026q3/rates_host.txt: 51.523 / 51.511) -- and that repo's own
      evidence collector header says, verbatim, "QoS-matched rclpy subscribers, never
      `ros2 topic hz`". The driver does not decimate (odom_publish_rate_hz defaults to
      0.0 = pass-through, odom_tf_bridge.py:207), and the gap MEDIAN of 38.54 ms rules
      out a startup gap: a 51.5 Hz stream interrupted once would keep a ~19.4 ms median
      with a single outlier, not double its median. The end-to-end rate a Ferox consumer
      actually sees is therefore ~26 Hz. Campaign section 4.3 asks the twin for 50 Hz
      odom; that target is NOT what the robot delivers. See OQ-3.

  - name: /ferox/g1_01/imu/data
    type: sensor_msgs/msg/Imu
    direction: publish
    frame_id: dog_imu_link
    rate_hz: 100.0
    qos: {reliability: reliable, durability: volatile}
    parity_class: A
    provenance: configured
    source: >-
      panthera-g1-driver/.../g1_driver_hw.launch.py:289 (out_topic), downsampled by
      imu_republisher from /lowstate.imu_state.

  - name: /livox/lidar
    type: sensor_msgs/msg/PointCloud2
    direction: publish
    frame_id: livox_frame
    rate_hz: 10.0
    qos: {reliability: reliable, durability: volatile}
    parity_class: A
    provenance: measured
    source: >-
      panthera-g1-driver/evidence/fw2026q3/session_a/13_livox_lidar.txt
      (average rate 10.000, frame_id livox_frame, 19968-20064 points/msg, Jetson-stamped).
      Published by our own livox_ros_driver2 sidecar, not by Unitree firmware.
    expect:
      # DECLARED APPROXIMATION -- see TWIN_DEVIATIONS.md. The field layout of the CURRENT
      # /livox/lidar stream is NOT recorded anywhere in the driver repo. The only real
      # layout we hold is for the RETIRED Unitree stream /utlidar/cloud_livox_mid360
      # (evidence/phase0/streams_90s.json: point_step 22, x/y/z/intensity FLOAT32,
      # ring UINT16, time FLOAT32). The twin publishes that layout until a real capture
      # of /livox/lidar arrives. See OQ-2.
      pointcloud_fields:
        - {name: x,         datatype: FLOAT32, offset: 0,  count: 1}
        - {name: y,         datatype: FLOAT32, offset: 4,  count: 1}
        - {name: z,         datatype: FLOAT32, offset: 8,  count: 1}
        - {name: intensity, datatype: FLOAT32, offset: 12, count: 1}
        - {name: ring,      datatype: UINT16,  offset: 16, count: 1}
        - {name: time,      datatype: FLOAT32, offset: 18, count: 1}
      point_step: 22

  - name: /livox/imu
    type: sensor_msgs/msg/Imu
    direction: publish
    frame_id: livox_imu
    rate_hz: 200.0
    qos: {reliability: reliable, durability: volatile}
    parity_class: B
    provenance: measured
    source: >-
      Published and currently unconsumed on the robot
      (panthera-g1-driver/FW_MIGRATION_REPORT.md:635; livox_driver_node log in
      evidence/fw2026q3/session_a/15_lidar_logs_5min.txt:24). Rate 200 Hz from the
      equivalent Unitree stream /utlidar/imu_livox_mid360 measured at 200.02 Hz
      (evidence/phase0/streams_90s.json). Campaign amendment 2 requires the twin to
      publish it for fast_lio2_dockerized.

  - name: /ferox/g1_01/camera/color/image_raw
    type: sensor_msgs/msg/Image
    direction: publish
    frame_id: camera_color_optical_frame
    rate_hz: 30.0
    rate_rule: camera
    qos: {reliability: reliable}
    parity_class: A
    provenance: configured
    source: realsense_driver/README.md:22,28; compose.yaml:22,28
    expect:
      encoding: rgb8

  - name: /ferox/g1_01/camera/color/camera_info
    type: sensor_msgs/msg/CameraInfo
    direction: publish
    frame_id: camera_color_optical_frame
    rate_hz: 30.0
    rate_rule: camera
    qos: {reliability: reliable}
    parity_class: A
    provenance: configured
    source: realsense_driver/README.md:23; frame per README.md:28
    expect:
      camera_info:
        width: 1280
        height: 720
        distortion_model: plumb_bob
        # ASSUMED: D435i factory-typical, HFOV 69 deg at 1280x720. The real K and D come
        # from the device at runtime and are in NO repo (realsense_driver has zero
        # intrinsics). Replace from a real capture -- OQ-1.
        K: [908.0, 0.0, 640.0, 0.0, 908.0, 360.0, 0.0, 0.0, 1.0]

  - name: /ferox/g1_01/camera/aligned_depth_to_color/image_raw
    type: sensor_msgs/msg/Image
    direction: publish
    frame_id: camera_color_optical_frame
    rate_hz: 30.0
    rate_rule: camera
    qos: {reliability: reliable}
    parity_class: A
    provenance: configured
    source: >-
      realsense_driver/README.md:24 (1280x720, 16UC1, 30 Hz, RELIABLE), :28 (frame),
      compose.yaml:25 (align_depth.enable). Carries the SAME stamp as its colour frame
      (README.md:31-32) -- colour/depth skew is structurally zero, not merely small.
    expect:
      encoding: 16UC1

  - name: /ferox/g1_01/camera/aligned_depth_to_color/camera_info
    type: sensor_msgs/msg/CameraInfo
    direction: publish
    frame_id: camera_color_optical_frame
    rate_hz: 30.0
    rate_rule: camera
    qos: {reliability: reliable}
    parity_class: A
    provenance: configured
    source: realsense_driver/README.md:25; compose.yaml:25
    expect:
      camera_info:
        width: 1280
        height: 720
        distortion_model: plumb_bob
        K: [908.0, 0.0, 640.0, 0.0, 908.0, 360.0, 0.0, 0.0, 1.0]

  - name: /ferox/g1_01/camera/depth/color/points
    type: sensor_msgs/msg/PointCloud2
    direction: publish
    # INTENTIONAL ASYMMETRY: the cloud is stamped in the DEPTH optical frame even though
    # it is textured from colour. A twin that publishes it in the colour optical frame
    # breaks the contract.
    frame_id: camera_depth_optical_frame
    rate_hz: 30.0
    rate_rule: camera
    qos: {reliability: best_effort}
    parity_class: A
    provenance: configured
    source: >-
      realsense_driver/README.md:26 (topic/type/fields/frame); params.yaml:25
      (pointcloud_qos: SENSOR_DATA -> BEST_EFFORT); params.yaml:19-20 (stream_filter 2 =
      colour texture); params.yaml:47 (424x240 after decimation 2).
      Only the cloud is BEST_EFFORT; colour and aligned depth stay RELIABLE.

  - name: /ferox/g1_01/cmd_vel
    type: geometry_msgs/msg/Twist
    direction: subscribe
    frame_id: ""
    qos: {reliability: reliable}
    parity_class: A
    provenance: configured
    source: >-
      Consumed by cmd_vel_to_loco. Clamps: vx [-0.2, +0.4], vy [-0.2, +0.2],
      wz [-0.5, +0.5] (panthera-g1-driver config/g1_driver.yaml, cmd_vel_to_loco block).

cmd_vel_clamps:
  linear_x: [-0.2, 0.4]
  linear_y: [-0.2, 0.2]
  angular_z: [-0.5, 0.5]
  provenance: configured
  source: panthera-g1-driver config g1_driver.yaml (cmd_vel_to_loco)
